name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install the pi runtime the tests run against
        run: npm install --no-save --no-package-lock --ignore-scripts @earendil-works/pi-coding-agent@1.3.0
      - run: npm test
      - run: npm pack --dry-run
